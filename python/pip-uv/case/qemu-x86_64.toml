  t uv-lock-check      'cd /tmp/uvproj && uv lock --offline && uv lock --check 2>&1 | tail -1 && uv lock --check-exists 2>&1 | tail -1 && uv lock --dry-run'
  ti uv-sync-check      'cd /tmp/uvproj && uv sync --frozen --check 2>&1 | tail -2 || true; uv sync --frozen --dry-run --output-format json 2>&1 | tail -2 || true; uv sync --frozen --no-install-project 2>&1 | tail -2 || true'
  t uv-export-fmt      'cd /tmp/uvproj && uv lock --offline && uv export --format pylock.toml --no-hashes 2>&1 | tail -2 && uv export --format cyclonedx1.5 2>&1 | tail -2 && uv export --no-header --no-annotate -o /tmp/exp.txt && uv export --frozen --no-emit-workspace'
  t uv-tree-proj-opts  'cd /tmp/uvproj && uv lock --offline && uv tree --frozen --depth 1 --no-dedupe --invert 2>&1 | tail -3 && uv tree --frozen --universal'
  t uv-run-opts        'cd /tmp/uvproj && uv run --no-project --offline -m site 2>&1 | tail -1 || true; printf "PYUV=1\n" > /tmp/uv.env && uv run --no-project --offline --env-file /tmp/uv.env python -c "import os;print(os.environ.get(\"PYUV\"))" 2>&1 | tail -1; printf "# /// script\n# ///\nprint(7)\n" > /tmp/s.py && uv run --no-project --offline --script /tmp/s.py'
  ti uv-run-with       'cd /tmp/uvproj && uv run --offline --with localpkg --find-links /tmp/findlinks python -c "print(1)" 2>&1 | tail -1 || true'
  t uv-version-proj    'cd /tmp/uvproj && uv version --short && uv version --output-format json 2>&1 | tail -1 && uv version --dry-run --bump minor 2>&1 | tail -1 && uv version --dry-run --frozen 1.2.3'
  t uv-self-version-fmt 'uv self version --short && uv self version --output-format json'
  t uv-python-list-fmt 'uv python list --only-installed && uv python list --all-versions --output-format json 2>&1 | head -c 80'
  ti uv-python-find-opts 'uv python find --show-version 2>&1 | tail -1 || true; uv python find --system 2>&1 | tail -1 || true; uv python find 3 2>&1 | tail -1 || true'
  ti uv-python-pin-opts 'cd /tmp/uvproj && uv python pin --no-project 3.12 2>&1 | tail -1 && uv python pin --resolved 2>&1 | tail -1 || true; uv python pin --rm 2>&1 | tail -1 || true'
  t uv-python-dir-bin  'uv python dir --bin'
  ti uv-python-uninst   'uv python uninstall --all 2>&1 | tail -2 || true'
  t uv-python-updshell 'uv python update-shell 2>&1 | tail -2 || uv python update-shell --help'
  ti uv-python-inst    'uv python install --offline --default --reinstall 3.12 2>&1 | tail -2 || true'
  ti uv-tool-list-opts  'uv tool list --show-paths --show-version-specifiers --show-with --show-extras --show-python 2>&1 | tail -2 || true'
  t uv-tool-dir-bin    'uv tool dir --bin'
  ti uv-tool-uninst-all 'uv tool uninstall --all 2>&1 | tail -2 || true'
  ti uv-tool-upgrade    'uv tool upgrade --all --offline 2>&1 | tail -2 || true'
  t uv-tool-updshell   'uv tool update-shell 2>&1 | tail -2 || uv tool update-shell --help'
  ti uv-cache-clean-pkg 'uv cache clean localpkg 2>&1 | tail -1 || true; uv cache clean --force 2>&1 | tail -1 || true'
  ti uv-cache-prune-ci  'uv cache prune --ci 2>&1 | tail -1 || true; uv cache prune --force 2>&1 | tail -1 || true'
  ti uv-cache-size-h   'uv cache size --human 2>&1 | tail -1 || true'
  ti uv-auth-dir-token  'uv auth dir && uv auth dir pypi.org 2>&1 | tail -1 || true; uv auth token pypi.org 2>&1 | tail -1 || true'
  ti uv-workspace-meta  'cd /tmp/uvproj && uv workspace metadata 2>&1 | tail -2 || true; uv workspace dir 2>&1 | tail -1 || true'
  ti uv-format-check   'cd /tmp/uvproj && uv format --check --offline 2>&1 | tail -2 || true; uv auth login --help 2>&1 | head -2; uv auth logout --help 2>&1 | head -2'
  ti uvx-version       'uvx --version 2>&1 | tail -1 || uv tool run --version 2>&1 | tail -1 || true'
  # free the uv venvs/project (RAM-backed tmpfs) before the heavy build/cache ops below
  rm -rf /tmp/uvv /tmp/uvv2 /tmp/uvproj 2>/dev/null; echo "CLEANUP-pre-uvbuild"
  ti uv-build          'cd /tmp/lp && uv build --offline --no-build-isolation 2>&1 | tail -2 || true'
  t uv-build-opts     'cd /tmp/lp && uv build --offline --no-build-isolation --sdist -o /tmp/uvdist 2>&1 | tail -2 && uv build --offline --no-build-isolation --wheel --clear -o /tmp/uvdist 2>&1 | tail -2 && uv build --offline --no-build-isolation --force-pep517 -o /tmp/uvdist2'
  ti uv-cache-clean    'uv cache clean 2>&1 | tail -1 || true'
  ti uv-cache-prune    'uv cache prune 2>&1 | tail -1 || true'
  ti uv-publish-dry    'cd /tmp/lp && uv build --offline --no-build-isolation -o dist 2>&1 | tail -1; uv publish --dry-run dist/* 2>&1 | tail -2 || true'
  t uv-tool-help      'uv tool --help'
  ti uv-tool-dir       'uv tool dir || true'
  ti uv-tool-list      'uv tool list || true'
  unset UV_OFFLINE
else
  echo "UV_PRESENT=0"
fi

# ================= ONLINE (PyPI / Tsinghua+Aliyun mirrors over slirp) =================
# Online install MUST be exercised (official PyPI + Tsinghua -i + extra-index-url + config
# mirror + self-upgrade). Recorded as CBNET, NOT in the offline gate. On host these run;
# on starry the TLS large-segment RX data-path is being root-fixed (#292) — until then a
# fast SIGKILL-bounded probe gates the suite so the run can never hang. Once the starry net
# data-path fix lands, set CARPET_ONLINE=1 in the starry toml to enable it there too.
# HOST-ONLY GATE: starry's net recv can block UNINTERRUPTIBLY (a stalled TLS RX leaves the
# task in D-state; even `timeout -s KILL` cannot reap it -> the whole run hangs to the qemu
# timeout). So the entire online section runs ONLY when CARPET_ONLINE=1 (run_host.sh sets it).
# starry (toml) leaves it unset -> section skipped entirely -> never hangs, reaches CARPET_END.
if [ "${CARPET_ONLINE:-0}" = 1 ]; then
for IF in eth0 enp0s1 enp0s2 enp0s3; do ip link set $IF up 2>/dev/null; ip addr add 10.0.2.15/24 dev $IF 2>/dev/null; done
ip route add default via 10.0.2.2 2>/dev/null
[ -s /etc/resolv.conf ] || echo "nameserver 10.0.2.3" > /etc/resolv.conf 2>/dev/null
mkdir -p /tmp/on
# Probe with pip itself (proxy/fake-IP-aware, same data path the online tests use) rather than a
# raw socket — a SIGKILL-bounded `pip download` of a tiny pkg. ok on host; on starry the TLS RX
# stall makes it time out -> clean skip (until the net data-path root-fix lands, then it auto-runs).
ONLINE_OK=0
rm -rf /tmp/on/_probe; mkdir -p /tmp/on/_probe
if timeout -s KILL 60 pip3 download --no-cache-dir --timeout 20 --retries 1 --no-deps -d /tmp/on/_probe six >/tmp/onp 2>&1 && ls /tmp/on/_probe/six* >/dev/null 2>&1; then ONLINE_OK=1; fi
echo "ONLINE_PROBE ok=$ONLINE_OK :: $(tail -1 /tmp/onp 2>/dev/null)"
if [ "$ONLINE_OK" = 1 ]; then
  n pip-online-pypi      'pip3 install --no-cache-dir --timeout 30 --retries 1 --target /tmp/on/np numpy && ls /tmp/on/np | grep -qi numpy'
  n pip-online-tsinghua  'pip3 install --no-cache-dir --timeout 30 --retries 1 -i https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple --target /tmp/on/six six && ls /tmp/on/six | grep -qi six'
  n pip-online-extraidx  'pip3 install --no-cache-dir --timeout 30 --retries 1 --index-url https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple --extra-index-url https://mirrors.aliyun.com/pypi/simple --target /tmp/on/req requests && ls /tmp/on/req | grep -qi requests'
  n pip-online-cfgmirror 'pip3 config set global.index-url https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple; pip3 install --no-cache-dir --timeout 30 --retries 1 --target /tmp/on/idna idna; R=$?; pip3 config unset global.index-url; [ $R -eq 0 ] && ls /tmp/on/idna | grep -qi idna'
  n pip-online-download  'pip3 download --no-cache-dir --timeout 30 --retries 1 --no-deps -d /tmp/on/dl certifi 2>&1 | tail -1; ls /tmp/on/dl | grep -qi certifi'
  n pip-online-index     'pip3 index versions pip 2>&1 | tail -2'
  if command -v uv >/dev/null 2>&1; then
    n uv-online-pypi     'uv venv /tmp/uvon >/dev/null 2>&1; uv pip install --python /tmp/uvon/bin/python --no-cache requests 2>&1 | tail -2; /tmp/uvon/bin/python -c "import requests"'
    n uv-online-mirror   'uv venv /tmp/uvon2 >/dev/null 2>&1; uv pip install --python /tmp/uvon2/bin/python --no-cache --default-index https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple six 2>&1 | tail -2; /tmp/uvon2/bin/python -c "import six"'
  fi
  # per user requirement: run LAST, after every other online test, against official PyPI
  n pip-upgrade-self-last 'python3 -m pip install --upgrade --no-cache-dir --timeout 30 --retries 1 pip 2>&1 | tail -2; pip3 --version'
else
  echo "ONLINE_SKIP reason=net-flaky (host probe failed this run)"
fi
else
  echo "ONLINE_SKIP reason=host-only (CARPET_ONLINE unset; starry net TLS-RX data-path bug #292 — online validated on host baseline + httpsprobe, auto-runs on starry once net fix lands)"
fi

echo "CB_RESULT=${OK}/${TOT}"
echo "CARPET_END"
'''
success_regex = ["(?m)^CARPET_END\\s*$"]
fail_regex = ['(?i)\bpanic(?:ked)?\b', 'BACKTRACE_BEGIN', 'Unhandled .* Exception', 'failed to determine root device']
timeout = 7200
