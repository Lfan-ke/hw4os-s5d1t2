  ti uv-audit-help     'uv audit --help 2>&1 | head -2'
  t  uv-check-offline  'cd /tmp/uvproj && uv lock --offline >/dev/null 2>&1; uv check --offline 2>&1 | tail -2 || uv lock --check 2>&1 | tail -2 || true'
  t uv-help-sub        'uv help'
  # ---- uv python full subcommands ----
  ti uv-python-find     'uv python find 2>&1 | tail -1 || true'
  ti uv-python-pin      'cd /tmp/uvproj && uv python pin "$PYTAG" 2>&1 | tail -1 || true'
  ti uv-python-inst-h  'uv python install --help 2>&1 | head -2'
  ti uv-python-upg-h   'uv python upgrade --help 2>&1 | head -2'
  ti uv-python-unin-h  'uv python uninstall --help 2>&1 | head -2'
  # ---- uv tool full subcommands (run/install/upgrade need network -> --help level) ----
  ti uv-tool-run-h     'uv tool run --help 2>&1 | head -2'
  ti uvx-h             'uvx --help 2>&1 | head -2 || uv tool run --help 2>&1 | head -2'
  ti uv-tool-inst-h    'uv tool install --help 2>&1 | head -2'
  ti uv-tool-upg-h     'uv tool upgrade --help 2>&1 | head -2'
  ti uv-tool-unin-h    'uv tool uninstall --help 2>&1 | head -2'
  # ---- uv cache size + self update (network) ----
  ti uv-cache-size      'uv cache size 2>&1 | tail -1 || true'
  ti uv-self-upd-h     'uv self update --help 2>&1 | head -2'
