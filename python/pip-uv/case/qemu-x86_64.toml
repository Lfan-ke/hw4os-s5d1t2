  ti uv-pip-list-fmt    'uv pip list --python /tmp/uvv/bin/python --format json 2>&1 | head -1 || uv pip list --python /tmp/uvv/bin/python 2>&1 | head -1 || true'
  # ================= UV: coverage-gap (GATE/HELP) =================
  t uv-glb-flags       'uv --color never --no-config --version && uv -V && uv --directory /tmp --no-config self version --short; uv --no-cache pip list --python /tmp/uvv/bin/python | head -1; uv --directory /tmp/uvproj tree --offline'
  t uv-help-subcmd     'uv help pip install 2>&1 | head -3 && uv help python'
  t uv-pip-list-strict 'uv pip list --python /tmp/uvv/bin/python --format freeze && uv pip list --python /tmp/uvv/bin/python --format json && uv pip list --python /tmp/uvv/bin/python --strict && uv pip list --python /tmp/uvv/bin/python --exclude pip --exclude-editable'
  t uv-pip-show-files  'uv pip install --python /tmp/uvv/bin/python --no-index --find-links "$WHEELS" setuptools wheel >/dev/null 2>&1; uv pip show --python /tmp/uvv/bin/python -f localpkg && uv pip show --python /tmp/uvv/bin/python --strict setuptools wheel localpkg'
  t uv-pip-freeze-opts 'uv pip freeze --python /tmp/uvv/bin/python --exclude pip --exclude-editable && uv pip freeze --python /tmp/uvv/bin/python --strict'
  t uv-pip-tree-opts   'uv pip tree --python /tmp/uvv/bin/python --depth 2 --no-dedupe --show-version-specifiers --invert'
  ti uv-pip-check-plat 'uv pip check --python /tmp/uvv/bin/python --python-platform x86_64-unknown-linux-musl || true'
  t uv-pip-compile-fmt 'uv pip compile --no-index --find-links /tmp/findlinks /tmp/req.in -o /tmp/pylock.toml --format pylock.toml --no-header --no-annotate && uv pip compile --no-index --find-links /tmp/findlinks --universal --generate-hashes /tmp/req.in -o /tmp/c2.txt'
  t uv-pip-sync-opts   'uv pip sync --python /tmp/uvv/bin/python --no-index --find-links /tmp/findlinks --dry-run --strict /tmp/req.lock; printf "" > /tmp/empty.txt && uv pip sync --python /tmp/uvv/bin/python --allow-empty-requirements --dry-run /tmp/empty.txt'
  t uv-pip-inst-opts   'uv pip install --python /tmp/uvv/bin/python --no-index --find-links /tmp/findlinks --dry-run --no-deps localpkg && uv pip install --python /tmp/uvv/bin/python --no-build-isolation --target /tmp/uvtgt /tmp/lp && uv pip install --python /tmp/uvv/bin/python --no-build-isolation -e /tmp/lp && uv pip install --python /tmp/uvv/bin/python --no-index --find-links /tmp/findlinks -r /tmp/req.in; uv pip install --python /tmp/uvv/bin/python --no-index --find-links /tmp/findlinks --reinstall --no-deps localpkg'
  t uv-pip-uninst-opts 'uv pip uninstall --python /tmp/uvv/bin/python --dry-run localpkg; printf "localpkg\n" > /tmp/unr.txt && uv pip uninstall --python /tmp/uvv/bin/python -r /tmp/unr.txt --dry-run'
  t uv-venv-opts       'cd /tmp && rm -rf /tmp/uvvopt /tmp/uvvrel /tmp/uvpy && uv venv --clear --prompt myenv --system-site-packages --no-project /tmp/uvvopt && test -x /tmp/uvvopt/bin/python && uv venv --relocatable /tmp/uvvrel && uv venv --allow-existing /tmp/uvvrel && uv venv --python "$(command -v python3)" /tmp/uvpy && test -x /tmp/uvpy/bin/python'
  ti uv-venv-seed      'uv venv --seed /tmp/uvseed && test -x /tmp/uvseed/bin/python || true'
  t uv-init-shapes     'cd /tmp && rm -rf ib il ia ibe is.py && uv init --bare --no-workspace ib && uv init --lib --no-workspace --no-readme --vcs none il && uv init --app --no-workspace --name myapp --no-pin-python ia && uv init --script /tmp/is.py && uv init --no-workspace --build-backend setuptools ibe'
  t uv-add-opts        'cd /tmp/uvproj && uv add --no-sync --dev --bounds exact --offline --find-links /tmp/findlinks localpkg 2>&1 | tail -2; uv add --no-sync --group test --raw --offline --find-links /tmp/findlinks localpkg'
