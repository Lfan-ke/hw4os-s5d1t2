# GNU Make 4.4.1 (static musl, cross-built) running on StarryOS (#764 "verilog
# <!-- verilator, iverilog, gnumake -->"). make parses /root/Makefile, evaluates
# make variables/functions/pattern-rules, and forks /bin/sh in the rootfs to run
# each recipe; DoD = make completes AND stdout EXACT-matches the host golden.
args = [
    "-nographic", "-m", "2048M", "-cpu", "cortex-a72", "-smp", "1",
    "-device", "virtio-blk-pci,drive=disk0",
    "-drive", "id=disk0,if=none,format=raw,file=${workspace}/tmp/axbuild/rootfs/rootfs-aarch64-gnumake.img",
    "-device", "virtio-net-pci,netdev=net0", "-netdev", "user,id=net0",
]
uefi = false
to_bin = false
shell_prefix = "root@starry:/root #"
shell_init_cmd = '''
PASS=0; TOTAL=0
acc() { TOTAL=$((TOTAL+1)); if [ "$1" = 1 ]; then PASS=$((PASS+1)); echo "OK   $2"; else echo "FAIL $2"; fi; }
echo "=== GNU Make 4.4.1 (static musl) on StarryOS ==="
cd /root
/usr/local/bin/make -s -f /root/Makefile > /tmp/raw.txt 2>/tmp/got.err
grep -E '^  make: building |^MAKE_NAMES=|^MAKE_SORTED=|^GNUMAKE_BUILD_OK$' /tmp/raw.txt > /tmp/got.txt
grep -q '^GNUMAKE_BUILD_OK$' /tmp/got.txt && acc 1 "make ran recipes to completion" || { acc 0 "make completion"; echo "  stderr:"; tail -8 /tmp/got.err; echo "  raw:"; tail -8 /tmp/raw.txt; }
if cmp -s /tmp/got.txt /root/gnumake-golden.txt; then acc 1 "make stdout EXACT-match golden"; else acc 0 "make stdout MISMATCH"; echo "  diff:"; diff /root/gnumake-golden.txt /tmp/got.txt | head; fi
echo "GNUMAKE_RESULT pass=$PASS total=$TOTAL"
V=0; [ "$PASS" = "$TOTAL" ] && [ "$TOTAL" = "2" ] && V=1
printf 'GNUMAKE_OK=%s\n' "$V"
echo "GNUMAKE_DONE"
'''
success_regex = ["(?m)^GNUMAKE_OK=1"]
fail_regex = ['(?i)No such file', '(?i)\bpanic(?:ked)?\b']
timeout = 600
