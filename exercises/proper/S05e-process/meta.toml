id      = "S05e-process"
title   = "正经·S05e · 进程：fork / exec / wait + 写时复制（CoW）"
track   = "proper"
require = 1
env     = "qemu-virt"
weight  = 1

[[variant]]
id    = "kernel-c"
axis  = "software"
lang  = "c"
dir   = "kernel"
build = "qemu-virt"

[[variant]]
id    = "essay"
axis  = "essay"
lang  = "text"
dir   = "essay"
build = "essay"

[judge]
expect    = ["FORK_PASS", "COW_PASS", "EXEC_PASS", "WAIT_PASS", "ALL_PASS"]
forbid    = ["FAIL", "panic", "UNEXPECTED"]
timeout_s = 20

[[hint]]
text = "fork 复制地址空间：内核(map_kernel)已替子进程建好；你只处理用户私有页。栈走整页 eager 复制（trap 跑在用户栈上，栈不能只读 CoW，否则压栈即缺页嵌套）；数据页走 CoW——父子共指同一物理帧、双方都降为「只读+PTE_COW」、ref_inc。"
[[hint]]
text = "CoW 缺页分裂：va2pa 找命中页物理帧。若 ref_get(pa)>1（还有人共享）→ frame_alloc 新帧、kmemcpy 拷贝旧内容、ref_dec 旧帧、map_one 把本进程该 VA 改指新帧且恢复 W（清 COW）；否则（最后持有者）直接恢复 W。改完 sfence.vma，随后硬件重执行出错指令。"
[[hint]]
text = "缺页处理不要前移 sepc——修好映射后重执行同一条访存指令；ecall 才前移 +4。父进程读 CoW 页（R 仍在）不缺页；只有写才分裂。"
[[hint]]
text = "为何栈复制、数据页 CoW：CoW 省内存（fork 后多数页只读共享、写谁分裂谁），但与缺页机制强绑定。exec 用第二个内嵌程序换掉整个地址空间；wait 回收僵尸子进程拿退出码——这些已给，重点体会 fork 复制 + CoW 分裂两处。"
