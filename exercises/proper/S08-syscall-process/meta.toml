id      = "S08-syscall-process"
title   = "正经·S08 · 用户态与系统调用：sret 入 U 态、ecall 受控陷入"
track   = "proper"
require = 1
env     = "qemu-virt"
weight  = 1

[[variant]]
id    = "kernel-c"
axis  = "software"
lang  = "c"
dir   = "kernel"
build = "qemu-virt"

[[variant]]
id    = "essay"
axis  = "essay"
lang  = "text"
dir   = "essay"
build = "essay"

[judge]
expect    = ["SYSCALL_PASS", "PROC_PASS", "ALL_PASS"]
forbid    = ["FAIL", "panic", "UNEXPECTED"]
timeout_s = 15

[[hint]]
text = "进 U 态：清 sstatus.SPP(bit8) 让 sret 落到 U 态，置 sepc=用户入口、sp=用户栈顶，再 sret（见 uentry.S 的 run_user，已给）。"
[[hint]]
text = "U 态 ecall 触发异常：scause 最高位=0 且 code==8（SCAUSE_U_ECALL）。按 a7(x[17]) 分发，参数在 a0..a2(x[10..12])，返回值写回 a0(x[10])。"
[[hint]]
text = "处理完 ecall 必须 ctx->sepc += 4 跳过 ecall 指令，否则 sret 回到同一条 ecall 又立即陷入，死循环。"
[[hint]]
text = "sys_exit 用 return_to_kernel() 直接 longjmp 回内核主线（丢弃 U 态/trap 栈帧），不走 __restore；不做 fork/exec/地址空间（引申）。"
