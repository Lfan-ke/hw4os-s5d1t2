id      = "S04-async"
title   = "正经·S04 · embassy 式异步运行时：Future/poll + 最小 executor + 延时 future(waker)"
track   = "proper"
require = 1
env     = "qemu-virt"
weight  = 1

[[variant]]
id    = "kernel-c"
axis  = "software"
lang  = "c"
dir   = "kernel"
