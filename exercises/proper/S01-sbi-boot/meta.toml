id      = "S01-sbi-boot"
title   = "正经·S01 · 传统引导与 SBI：OpenSBI 引导 S 态内核（ecall / putchar / 关机）"
track   = "proper"
require = 1
env     = "qemu-virt"
weight  = 1

[[variant]]
id    = "kernel-c"
axis  = "software"
lang  = "c"
dir   = "kernel"
build = "qemu-virt"

[judge]
expect    = ["SBI_BOOT", "PUTCHAR_PASS", "ALL_PASS"]
forbid    = ["FAIL", "panic"]
timeout_s = 15

[[hint]]
text = "SBI 调用约定：eid→a7, fid→a6, 参数→a0/a1/a2，执行 ecall，返回值在 a0。"
[[hint]]
text = "用 GCC 具名寄存器变量：register long r_a7 asm(\"a7\") = eid; 配合 asm volatile(\"ecall\" ...)。"
[[hint]]
text = "填对后 console_putchar/k_shutdown 自动可用：内核会打印 PASS 串并经 SRST 关机让 qemu 退出。"
