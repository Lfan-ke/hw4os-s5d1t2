# 01-hw-vlan 可视化声明 —— 驱动 labctl TUI 拓扑/数据流与 diagram 导出。
# 教学准确为先；labctl diagram --check 可对照 yosys netlist JSON 校验真实结构。

[[node]]
id = "in"
label = "in_pkt"
[[node]]
id = "parse"
label = "parse tag/dir/vid"
[[node]]
id = "mode"
label = "mode/pvid/allow/untag"
[[node]]
id = "op"
label = "insert / strip / filter / keep"
[[node]]
id = "out"
label = "out_pkt"

[[edge]]
from = "in"
to   = "parse"
[[edge]]
from = "parse"
to   = "op"
[[edge]]
from = "mode"
to   = "op"
[[edge]]
from = "op"
to   = "out"

# 数据流场景（TUI 动画 / diagram 高亮）
[[flow]]
name = "access-insert"
path = ["in", "parse", "op", "out"]
note = "Access 收包 · 无 Tag → 插入 PVID"
[[flow]]
name = "trunk-filter-drop"
path = ["in", "parse", "op", "out"]
note = "Trunk 收包 · vid 不在 allow → 丢弃 (DROP)"
[[flow]]
name = "hybrid-egress-strip"
path = ["in", "parse", "op", "out"]
note = "Hybrid 发包 · untag[vid]=1 → 剥离 Tag"

# 接口（配置/端口）面板
[[iface]]
name = "mode"
bits = "[1:0]"
note = "0=Access 1=Trunk 2=Hybrid"
[[iface]]
name = "pvid"
bits = "[5:0]"
note = "Access 收包插入的默认 VID"
[[iface]]
name = "allow"
bits = "[63:0]"
note = "VID 允许位图（Trunk/Hybrid）"
[[iface]]
name = "untag"
bits = "[63:0]"
note = "Hybrid 发包剥 Tag 的 VID 位图"
[[iface]]
name = "in_pkt/out_pkt"
bits = "[31:0]"
note = "VALID|HAS_TAG|DROP|DIR|VID[21:16]|PAYLOAD[15:0]"

[wave]
signals = ["clk", "mode", "in_pkt", "out_pkt", "drop"]
