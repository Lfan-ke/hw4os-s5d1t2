# java-lang x86_64 — multi-JDK (17/21/23/25) language carpet on StarryOS.
# -m 2048M: every sibling java case boots fine at 2G; a single -Xmx512m JVM never needs
# more. On x86 q35, >~3G guest RAM pushes virtio 64-bit PCI BARs into the high MMIO window
# the boot PML4 does not linear-map (separate iomap-PCI-BAR limitation) — 2G is the proven
# sane value (== openjdk-multi). The rootfs is the per-app rootfs-x86_64-alpine.img which
# prebuild.sh grows to 6G so 4 full JDKs (javac + lib + jmods) fit without truncation.
args = [
    "-nographic", "-m", "2048M", "-smp", "1",
    "-device", "virtio-blk-pci,drive=disk0",
    "-drive", "id=disk0,if=none,format=raw,file=${workspace}/tmp/axbuild/rootfs/rootfs-x86_64-alpine.img",
    "-device", "virtio-net-pci,netdev=net0", "-netdev", "user,id=net0",
]
uefi = false
to_bin = false
shell_prefix = "root@starry:/root #"
shell_init_cmd = "sh /usr/bin/run-java.sh"
success_regex = ['(?m)^TEST PASSED\s*$']
fail_regex = ['(?i)\bpanic(?:ked)?\b', '(?m)^TEST FAILED\s*$']
timeout = 18000
