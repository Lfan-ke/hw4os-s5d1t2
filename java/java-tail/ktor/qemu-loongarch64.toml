args = [
    "-machine", "virt", "-cpu", "la464", "-nographic", "-m", "8192M",
    "-device", "virtio-blk-pci,drive=disk0",
    "-drive", "id=disk0,if=none,format=raw,file=${workspace}/tmp/axbuild/rootfs/rootfs-loongarch64-ktor.img",
    "-device", "virtio-net-pci,netdev=net0", "-netdev", "user,id=net0",
]
uefi = false
to_bin = true
shell_prefix = "root@starry:/root #"
shell_init_cmd = '''
export JAVA_HOME=/usr/lib/jvm/java-17-openjdk
printf '/lib\n/usr/lib\n%s/lib\n%s/lib/server\n' "$JAVA_HOME" "$JAVA_HOME" > /etc/ld-musl-loongarch64.path
# --- Ktor 2.3.12 (Kotlin 1.9.25 async web, Netty engine; loopback 127.0.0.1:18082) ---
# Host-compiled fat jar (Kotlin compiled on host to dodge on-starry kotlinc crash #237,
# like exposed/springkt). Binds 127.0.0.1:18082, prints KTOR_READY, then blocks.
# This exercises the Kotlin coroutines runtime + Netty NIO event loop + Ktor routing
# pipeline + kotlinx.serialization JSON content-negotiation end-to-end over starry net.
$JAVA_HOME/bin/java -Xint -Xms64m -Xmx256m -jar /root/ktor/ktor-demo.jar >/tmp/ktor.out 2>&1 &
JPID=$!
# Wait for the engine to accept connections (slow -Xint + emulated-arch warmup; up to ~240s).
SRV_READY=0
for i in $(seq 1 240); do
  grep -q KTOR_READY /tmp/ktor.out && { SRV_READY=1; break; }
  kill -0 $JPID 2>/dev/null || break
  sleep 1
done
PASS=0; TOTAL=0
# Raw HTTP/1.0 over busybox nc (GET + POST), assert exact status line + body.
get()  { printf 'GET %s HTTP/1.0\r\nHost: 127.0.0.1\r\n\r\n' "$1" | timeout 15 nc 127.0.0.1 18082; }
post() { b="$2"; printf 'POST %s HTTP/1.0\r\nHost: 127.0.0.1\r\nContent-Type: application/json\r\nContent-Length: %s\r\n\r\n%s' "$1" "${#b}" "$b" | timeout 15 nc 127.0.0.1 18082; }
chk() { # name resp expect_status expect_body
  TOTAL=$((TOTAL+1))
  st=$(printf '%s' "$2" | head -1 | tr -d '\r')
  bd=$(printf '%s' "$2" | awk 'f{print} /^\r?$/{f=1}' | tr -d '\r' | head -1)
  if echo "$st" | grep -q "$3" && [ "$bd" = "$4" ]; then PASS=$((PASS+1)); echo "OK   $1 [$st] body=[$bd]";
  else echo "FAIL $1 [$st] body=[$bd] (want '$3' body=[$4])"; fi
}
chkct() { # name resp expect_status expect_ctype  (content-negotiation proof: only a real Ktor stack emits this)
  TOTAL=$((TOTAL+1))
  st=$(printf '%s' "$2" | head -1 | tr -d '\r')
  ct=$(printf '%s' "$2" | grep -i '^Content-Type:' | head -1 | tr -d '\r')
  if echo "$st" | grep -q "$3" && echo "$ct" | grep -qi "$4"; then PASS=$((PASS+1)); echo "OK   $1 [$st] [$ct]";
  else echo "FAIL $1 [$st] [$ct] (want '$3' ctype '$4')"; fi
}
chkstatus() { # name resp expect_status  (body not checked, e.g. 404)
  TOTAL=$((TOTAL+1))
  st=$(printf '%s' "$2" | head -1 | tr -d '\r')
  if echo "$st" | grep -q "$3"; then PASS=$((PASS+1)); echo "OK   $1 [$st]"; else echo "FAIL $1 [$st] (want '$3')"; fi
}
if [ "$SRV_READY" = "1" ]; then
  chk      "/ping"        "$(get /ping)"                     "200 OK"        "KTOR_PONG"
  chk      "/add/3/4"     "$(get /add/3/4)"                  "200 OK"        '{"a":3,"b":4,"sum":7}'
  chk      "/add/foo/4"   "$(get /add/foo/4)"                "400 Bad"       "BAD_INT"
  chk      "/echo"        "$(get '/echo?msg=hello')"         "200 OK"        '{"echo":"hello","len":5}'
  chk      "/sum"         "$(post /sum '{"nums":[1,2,3,4]}')" "200 OK"       '{"total":10,"count":4}'
  chkstatus "/nope"       "$(get /nope)"                     "404 Not Found"
  # framework-stack proof: a JSON route MUST be served as application/json by the
  # Ktor ContentNegotiation(json()) plugin. A broken/wrong web stack cannot produce
  # both the exact serialized body AND the negotiated content-type, so this is the
  # in-gate assertion that the genuine Ktor 2.3.x + kotlinx.serialization is running.
  chkct    "/add ctype"   "$(get /add/3/4)"                  "200 OK"        "application/json"
else
  echo "KTOR_NOT_READY"; grep -aiE "KTOR_ERR|Exception|Error" /tmp/ktor.out | tail -10
fi
kill $JPID 2>/dev/null
echo "KTOR_RESULT pass=$PASS total=$TOTAL"
# Gate: server came up AND every assertion passed. (7 = 6 routes + 1 ctype proof.)
V=0; [ "$SRV_READY" = "1" ] && [ "$PASS" = "$TOTAL" ] && [ "$TOTAL" = "7" ] && V=1
printf 'KTOR_OK=%s\n' "$V"
'''
success_regex = ["(?m)^KTOR_OK=1"]
fail_regex = ['(?i)\bpanic(?:ked)?\b']
timeout = 3000
