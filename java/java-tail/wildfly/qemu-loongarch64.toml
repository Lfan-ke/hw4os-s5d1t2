args = [
    "-machine", "virt", "-cpu", "la464", "-nographic", "-m", "8192M",
    "-device", "virtio-blk-pci,drive=disk0",
    "-drive", "id=disk0,if=none,format=raw,file=${workspace}/tmp/axbuild/rootfs/rootfs-loongarch64-wildfly.img",
    "-device", "virtio-net-pci,netdev=net0", "-netdev", "user,id=net0",
]
uefi = false
to_bin = true
shell_prefix = "root@starry:/root #"
shell_init_cmd = '''
export JAVA_HOME=/usr/lib/jvm/java-17-openjdk
printf '/lib\n/usr/lib\n%s/lib\n%s/lib/server\n' "$JAVA_HOME" "$JAVA_HOME" > /etc/ld-musl-loongarch64.path
# --- WildFly 40.0.0.Final (full Jakarta EE 10 app server) on StarryOS ----------
# Boot the REAL server: bin/standalone.sh -> jboss-modules.jar -> org.jboss.as.standalone.
# This exercises the modular classloader, the Undertow web subsystem on :8080, and a
# multi-minute -Xint boot. JIT is unstable on starry (#206) so JAVA_OPTS forces -Xint.
# standalone.conf default heap is -Xms64m -Xmx512m; we keep that (a full EE server needs
# the headroom) and only prepend -Xint. The harness boots the server backgrounded, waits
# for the WFLYSRV0025 "started" banner, probes :8080, asserts HTTP 200 + the welcome-content
# body + the 40.0.0.Final version banner, then `kill`s the server PID (NOT jboss-cli — that
# forks a 2nd JVM whose mgmt SSL handshake times out under the emulated single-core guest).
export JAVA_OPTS="-Xint -Djava.net.preferIPv4Stack=true"
WF=/opt/wildfly-40.0.0.Final
rm -f $WF/standalone/log/server.log 2>/dev/null
# Launch in background; capture the standalone.sh PID (its java child shares the
# process group so the final `kill` + pkill tear the whole server down).
sh $WF/bin/standalone.sh -b 127.0.0.1 >/tmp/wf.out 2>&1 &
PID=$!
# Wait for the org.jboss WFLYSRV0025 "started in" banner (full EE boot under -Xint +
# emulated arch is slow; allow up to ~600s). Bail early if the launcher dies.
SRV_READY=0
for i in $(seq 1 600); do
  grep -aq "WFLYSRV0025" /tmp/wf.out && { SRV_READY=1; break; }
  grep -aqE "WFLYSRV0026|Aborted|FATAL" /tmp/wf.out && break
  kill -0 $PID 2>/dev/null || break
  sleep 1
done
PASS=0; TOTAL=0
acc() { TOTAL=$((TOTAL+1)); if [ "$1" = 1 ]; then PASS=$((PASS+1)); echo "OK   $2"; else echo "FAIL $2"; fi; }
get() { printf 'GET %s HTTP/1.0\r\nHost: 127.0.0.1\r\n\r\n' "$1" | timeout 20 nc 127.0.0.1 8080; }
if [ "$SRV_READY" = "1" ]; then
  RESP="$(get /)"
  # 1) HTTP 200 status line from the Undertow web subsystem
  echo "$RESP" | head -1 | grep -q "200 OK" && acc 1 "GET / -> 200 OK" || acc 0 "GET / status [$(echo "$RESP" | head -1 | tr -d '\r')]"
  # 2) welcome-content body proof — a genuine running WildFly serves this exact page
  echo "$RESP" | grep -q "Welcome to WildFly" && acc 1 "welcome page title" || acc 0 "welcome page title"
  echo "$RESP" | grep -q "Your WildFly instance is running" && acc 1 "welcome page running marker" || acc 0 "welcome page running marker"
  # 3) version assert (in-gate): the started banner MUST name 40.0.0.Final; a wrong/old
  #    server would print a different version, so this fails the gate.
  grep -aq "40.0.0.Final" /tmp/wf.out && acc 1 "version banner 40.0.0.Final" || acc 0 "version banner 40.0.0.Final"
else
  echo "WILDFLY_NOT_READY"; grep -aiE "WFLYSRV002[56]|Exception|Error|Aborted" /tmp/wf.out | tail -15
fi
# Teardown: kill the server PID (per design — no jboss-cli). pkill the jboss java
# child as belt-and-suspenders so the emulator frees cleanly.
kill $PID 2>/dev/null
pkill -f "org.jboss.as.standalone" 2>/dev/null
echo "WILDFLY_RESULT pass=$PASS total=$TOTAL"
# Gate: server started AND all 4 assertions passed (200 + 2 body markers + version).
V=0; [ "$SRV_READY" = "1" ] && [ "$PASS" = "$TOTAL" ] && [ "$TOTAL" = "4" ] && V=1
printf 'WILDFLY_OK=%s\n' "$V"
'''
success_regex = ["(?m)^WILDFLY_OK=1"]
fail_regex = ['(?i)\bpanic(?:ked)?\b']
timeout = 4500
