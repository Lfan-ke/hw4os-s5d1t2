args = [
    # -m 2048M (was 4096M): match sibling java cases; one -Xmx512m JVM never needs 4G.
    "-nographic", "-m", "2048M", "-smp", "1", "-cpu", "cortex-a72",
    "-device", "virtio-blk-pci,drive=disk0",
    "-drive", "id=disk0,if=none,format=raw,file=${workspace}/tmp/axbuild/rootfs/rootfs-aarch64-jdk-multi.img",
    "-device", "virtio-net-pci,netdev=net0", "-netdev", "user,id=net0",
]
uefi = false
to_bin = true
shell_prefix = "root@starry:/root #"
shell_init_cmd = '''
ARCH=aarch64
LDP=/etc/ld-musl-$ARCH.path
setp() { printf '/lib\n/usr/lib\n%s/lib\n%s/lib/server\n' "$1" "$1" > "$LDP"; }
setp /opt/jdk17
export JAVA_TOOL_OPTIONS="-Xint"
echo "=== Kotlin language carpet (kotlinc 2.0.21 -> host jar, run on starry JVM) ==="
/opt/jdk17/bin/java -Xint -Xmx512m -Xms64m -jar /root/KotlinCarpet.jar >/tmp/k.out 2>&1
grep -aE 'KOTLIN_CARPET|KOTLIN_OK|KOTLIN_FAIL' /tmp/k.out | tail -3
if grep -qa '^KOTLIN_OK$' /tmp/k.out; then V=1; else V=0; echo "FAIL tail:"; tail -15 /tmp/k.out; fi
printf 'KOTLIN_GATE=%s\n' "$V"
echo "KOTLIN_DONE"
'''
success_regex = ["(?m)^KOTLIN_GATE=1"]
fail_regex = ['(?i)\bpanic(?:ked)?\b']
timeout = 4000
