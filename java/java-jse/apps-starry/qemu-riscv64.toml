# java-jse riscv64 — J2SE library + JSE standard-library carpet on OpenJDK 17.
# JDK17 is the native riscv64-musl cross build (RV64GC baseline; the JIT is forced off via
# -Xint by run-jse.sh, so no vector/bitmanip extension is emitted). sqlite-jdbc loads the
# cross-built JNI .so staged at /root/jse/native. The rootfs is the per-app
# rootfs-riscv64-alpine.img which prebuild.sh grows to 2.5G. The JVM runs -Xmx256m.
args = [
    "-nographic", "-m", "2048M", "-smp", "1", "-cpu", "rv64",
    "-device", "virtio-blk-pci,drive=disk0",
    "-drive", "id=disk0,if=none,format=raw,file=${workspace}/tmp/axbuild/rootfs/rootfs-riscv64-alpine.img",
    "-device", "virtio-net-pci,netdev=net0", "-netdev", "user,id=net0",
]
uefi = false
to_bin = true
shell_prefix = "root@starry:/root #"
shell_init_cmd = "sh /usr/bin/run-jse.sh"
success_regex = ['(?m)^TEST PASSED\s*$']
fail_regex = ['(?i)\bpanic(?:ked)?\b', '(?m)^TEST FAILED\s*$']
timeout = 18000
