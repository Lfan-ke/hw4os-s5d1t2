# Neo4j Community 2026.04.0 — embedded graph-DB kernel smoke on StarryOS loongarch64.
# #764 big-app "neo4j". Pure-Java distribution (235 arch-independent jars); per-arch
# coverage via the musl JDK. Core jars are class-major 65 (Java 21) -> target /opt/jdk21
# (Alpine musl 21.0.11) in the jdk-multi base. Runs the REAL graph-DB kernel embedded
# in one JVM (page cache + record/token stores + WAL + Cypher), 5 Cypher round-trip
# assertions. Backing on mmap-EOF fix rcore-os/tgoskits#1164. -Xint (#206);
# -machine virt -cpu la464.
args = [
    "-machine", "virt", "-cpu", "la464", "-nographic", "-m", "4096M", "-smp", "1",
    "-device", "virtio-blk-pci,drive=disk0",
    "-drive", "id=disk0,if=none,format=raw,file=${workspace}/tmp/axbuild/rootfs/rootfs-loongarch64-neo4j.img",
    "-device", "virtio-net-pci,netdev=net0", "-netdev", "user,id=net0",
]
uefi = false
to_bin = true
shell_prefix = "root@starry:/root #"
shell_init_cmd = '''
export JAVA_HOME=/opt/jdk21
printf '/lib\n/usr/lib\n%s/lib\n%s/lib/server\n%s/lib/zero\n' "$JAVA_HOME" "$JAVA_HOME" "$JAVA_HOME" > /etc/ld-musl-loongarch64.path
export HOME=/root
NEO=/opt/neo4j
$JAVA_HOME/bin/java -Xint -Xms64m -Xmx768m -Djna.boot.library.path=/opt/jna -Djna.nounpack=true \
  -cp "$NEO/lib/*:$NEO" \
  Neo4jEmbeddedSmoke > /tmp/neo4j.out 2>&1
cat /tmp/neo4j.out
RES=$(grep '^NEO4J_RESULT' /tmp/neo4j.out | tail -1)
P=$(echo "$RES" | sed -E 's/.*pass=([0-9]+).*/\1/'); T=$(echo "$RES" | sed -E 's/.*total=([0-9]+).*/\1/')
V=0; [ -n "$T" ] && [ "$P" = "$T" ] && [ "$T" -ge 11 ] && V=1
printf 'NEO4J_OK=%s\n' "$V"
echo "NEO4J_DONE"
'''
success_regex = ["(?m)^NEO4J_OK=1"]
fail_regex = ['(?i)\bpanic(?:ked)?\b']
timeout = 7200
