id      = "S05-scheduler"
title   = "正经·S05 · 协作式多任务与调度器：单核 OS 的心脏"
track   = "proper"
require = 1
env     = "qemu-virt"
weight  = 1

[[variant]]
id    = "kernel-c"
axis  = "software"
lang  = "c"
dir   = "kernel"
build = "qemu-virt"

[[variant]]
id    = "essay"
axis  = "essay"
lang  = "text"
dir   = "essay"
build = "essay"

[judge]
expect    = ["SWITCH_PASS", "SCHED_PASS", "ALL_PASS"]
forbid    = ["FAIL", "panic", "UNEXPECTED"]
timeout_s = 15

[[hint]]
text = "TaskContext 只存 callee-saved（ra/sp/s0-s11）。__switch.S：把这 14 个寄存器 sd 进 cur(a0)，再从 next(a1) ld 回来，最后 ret。偏移 ra=0,sp=8,s0=16,...,s11=104。"
[[hint]]
text = "新任务首次被调度要能落进任务体：sched_init 预置 cx.ra=task_body、cx.sp=该任务栈顶。__switch 的 ret 就会跳到 task_body 并用新栈。"
[[hint]]
text = "schedule() = 轮转选择 + 切换：从 (current+1)%NTASK 起环形找第一个 READY；找不到（全 EXITED）就 __switch 回 boot_cx 结束；否则切到 next。先用旧 current 选 next，再更新 current。"
