id      = "S06b-hal"
title   = "正经·S06b · 硬件抽象层(HAL)：迷你 Abstract Machine（TRM/IOE/CTE）"
track   = "proper"
require = 1
env     = "qemu-virt"
weight  = 1

[[variant]]
id    = "kernel-c"
axis  = "software"
lang  = "c"
dir   = "kernel"
build = "qemu-virt"

[[variant]]
id    = "essay"
axis  = "essay"
lang  = "text"
dir   = "essay"
build = "essay"

[judge]
expect    = ["TRM_PASS", "IOE_PASS", "CTE_PASS", "ALL_PASS"]
forbid    = ["FAIL", "panic", "UNEXPECTED"]
timeout_s = 20

[[hint]]
text = "IOE：ioe_read(AM_TIMER_UPTIME,&t) 要把 t->us 填成“开机微秒数”。virt 机 mtime≈10MHz，故 us = rdtime()/10（riscv.h 的 r_time() 就是 rdtime）。占位返回 0 → 连读不增 → IOE_MISS。"
[[hint]]
text = "CTE 自陷：yield() 执行一条断点指令自陷（用未压缩编码 .word 0x00100073，确保 sepc+=4 正好跨过）。S 态 ecall 会被 OpenSBI 当 SBI 调用截走，故用 ebreak（断点异常 scause=3，默认委派到 S 态）作等价自陷。"
[[hint]]
text = "CTE 分发：__am_irq_handle 收到完整 Context，按 scause 翻成 Event（断点=EVENT_YIELD 并 sepc+=4），调用上层 handler，把它返回的“下一个 Context*”交回 trap.S。trap.S 会 mv sp,a0 切到该现场所在的栈再 sret —— 任务切换就此发生。"
