id      = "S05d-sync"
title   = "正经·S05d · 内核阻塞同步原语：互斥锁 / 信号量 / 条件变量（阻塞 vs 自旋）"
track   = "proper"
require = 1
env     = "qemu-virt"
weight  = 1

[[variant]]
id    = "kernel-c"
axis  = "software"
lang  = "c"
