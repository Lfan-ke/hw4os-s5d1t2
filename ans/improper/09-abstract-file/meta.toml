id      = "09-abstract-file"
title   = "设备文件 · 一切皆文件，文件即接口（FileLike + RingSum 软硬同构）"
track   = "improper"
require = 1               # 任一变体过即完成；多过计辅助分（软硬同构）
env     = "host"          # 软件纯逻辑 host 直接跑；硬件走 host 上的 iverilog/bsc 仿真
weight  = 1

# ── 四条实现路径（同一「FileLike 常量设备 + RingSum 设备」的软/硬不同写法）──
[[variant]]
id    = "sw-rust"
axis  = "software"
lang  = "rust"
dir   = "sw/rust"
build = "cargo"

[[variant]]
id    = "sw-c"
axis  = "software"
lang  = "c"
dir   = "sw/c"
build = "gcc-host"

[[variant]]
id        = "hw-v"
axis      = "hardware"
lang      = "verilog"
dir       = "hw/v"
build     = "iverilog"
warn_gate = true          # 0 warning 才算过

[[variant]]
id        = "hw-bsv"
axis      = "hardware"
lang      = "bsv"
dir       = "hw/bsv"
build     = "bsc"
warn_gate = true
top       = "mkTbAbstract"
entry     = "AbstractDev.bsv"

# ── 统一判题口径（四变体对外行为一致）──────────────────────────────
[judge]
expect    = ["FILELIKE_PASS", "RING_PASS", "ALL_PASS"]
forbid    = ["FAIL", "panic", "ERROR"]
timeout_s = 30

# ── 渐进提示 ──────────────────────────────────────────────────────
[[hint]]
text = "子实验 1 常量设备：read 恒返回 1，write(任意) 恒返回 0（数据吞掉、无存储）。像 /dev/zero（恒读固定值）+ /dev/null（写入丢弃）。"
[[hint]]
text = "子实验 2 RingSum：深度 2 环。write(x)=x==233 时清零 r0=r1=0；否则移位 r1<-r0; r0<-x。read()=r0+r1。验算 666→666、111→777、222→333、233→0。"
[[hint]]
text = "硬件 hw-v：const_read 改成 16'd1；always@(posedge clk) 里按 README 真值表更新 r0/r1（rdata=r0+r1 已给好）。所有分支给 r0/r1 都赋值，避免 latch。"
[[hint]]
text = "硬件 hw-bsv：填 mkRingDev 的 wr 方法（233 复位/否则移位）与 constRead（恒 16'd1）。tb 用 step 计数逐拍驱动，勿改。"
